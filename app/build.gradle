plugins { id 'com.android.application' }

def uploadKeystorePath = System.getenv('UPLOAD_KEYSTORE_PATH')
def uploadStorePassword = System.getenv('UPLOAD_STORE_PASSWORD')
def uploadKeyAlias = System.getenv('UPLOAD_KEY_ALIAS')
def uploadKeyPassword = System.getenv('UPLOAD_KEY_PASSWORD')
def hasUploadSigning = uploadKeystorePath && uploadStorePassword && uploadKeyAlias && uploadKeyPassword

android {
    namespace 'com.uam.cientodentistas'
    compileSdk 36

    defaultConfig {
        applicationId 'com.uam.cientodentistas'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        if (hasUploadSigning) {
            release {
                storeFile file(uploadKeystorePath)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasUploadSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}
