plugins { id 'com.android.application' }

android {
    namespace 'com.uam.cientodentistas'
    compileSdk 36

    defaultConfig {
        applicationId 'com.uam.cientodentistas'
        minSdk 23
        targetSdk 36
        versionCode 33
        versionName '3.0.16-cpu-practice'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
