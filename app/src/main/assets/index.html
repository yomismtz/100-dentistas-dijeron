<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#F7FBFF">
  <title>Así los Dentistas lo Dijeron</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="v2.css">
  <link rel="stylesheet" href="tvshow.css">
  <link rel="stylesheet" href="specialties.css">
  <link rel="stylesheet" href="careo.css">
  <link rel="stylesheet" href="narrator.css">
  <link rel="stylesheet" href="offline-classroom.css">
  <link rel="stylesheet" href="round-polish.css">
  <link rel="stylesheet" href="v3.css">
  <link rel="stylesheet" href="brand.css">
</head>
<body>
  <main id="home" class="screen home">
    <div class="homeHero">
      <img class="homeLogo" src="brand_logo.svg" alt="Logo de Así los Dentistas lo Dijeron">
      <div class="homeTitle">Conocimiento que <span>sonríe</span></div>
      <div class="homeSubtitle">PLATAFORMA EDUCATIVA DE ODONTOLOGÍA</div>
    </div>
    <div class="homeActions">
      <button id="start" class="primary">PARTIDA EN EQUIPO</button>
      <button id="help">¿CÓMO SE JUEGA?</button>
    </div>
  </main>
  <main id="game" class="screen hidden" aria-live="polite">
    <header class="topbar">
      <button id="prev" class="iconBtn" aria-label="Ronda anterior">◀</button>
      <div class="roundInfo">
        <span id="round">Ronda 1 · ×1</span>
        <span id="progress">1 / 8</span>
        <span id="turn">TURNO: EQUIPO 1</span>
      </div>
      <button id="soundToggle" class="iconBtn soundToggle" aria-label="Apagar todo el sonido" title="Sonido">🔊</button>\n      <button id="menu" class="iconBtn" aria-label="Menú">☰</button>
      <button id="next" class="iconBtn" aria-label="Ronda siguiente">▶</button>
    </header>
    <section class="board">
      <div class="questionRow">
        <h1 id="question"></h1>
        <div class="timerBox" title="Tiempo para responder">
          <span>TIEMPO</span>
          <div><strong id="timer">30</strong><small>s</small></div>
        </div>
        <div class="bank" title="Puntos revelados en esta ronda"><span>BANCO</span><strong id="bank">0</strong></div>
      </div>
      <div id="answers" class="answers"></div>
      <div id="strikes" class="strikes" aria-label="Errores"></div>
    </section>
    <footer class="scorebar">
      <section class="team teamOne">
        <button class="teamName" data-team="1">EQUIPO 1</button>
        <strong id="s1">0</strong>
        <button class="award" data-team="1">DAR BANCO</button>
      </section>
      <section class="centerControls">
        <button id="buzz" class="danger">✖ ERROR</button>
        <button id="undo" title="Deshacer última asignación">↶</button>
        <button id="resetRound" title="Reiniciar ronda">↻ RONDA</button>
      </section>
      <section class="team teamTwo">
        <button class="teamName" data-team="2">EQUIPO 2</button>
        <strong id="s2">0</strong>
        <button class="award" data-team="2">DAR BANCO</button>
      </section>
    </footer>
  </main>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modalCard">
      <button id="closeModal" class="closeBtn">×</button>
      <div id="modalContent"></div>
    </div>
  </div>
  <div id="strikeFlash" class="strikeFlash hidden"><div>✖ ✖ ✖</div></div>
  <audio id="sndStart" src="intro_full_original.wav" preload="auto"></audio>
  <audio id="sndGood" src="good.mp3" preload="auto"></audio>
  <audio id="sndBad" src="error.mp3" preload="auto"></audio>
  <script src="questions-loader.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded',function(){
      var b=document.getElementById('privacyBtn');
      if(!b)return;
      b.addEventListener('click',function(){
        var url='https://yomismtz.github.io/100-dentistas-dijeron/privacy.html';
        try{if(window.Android&&Android.openUrl){Android.openUrl(url);return;}}catch(_){}
        window.open(url,'_blank');
      });
    });
  </script>
  <script src="app.js"></script>
  <script src="characters.js"></script>
  <script src="v2.js"></script>
  <script src="v2-extras.js"></script>
  <script src="specialties.js"></script>
  <script src="tvshow.js"></script>
  <script src="careo.js"></script>
  <script src="narrator.js"></script>
  <script src="offline-remote.js"></script>
  <script src="offline-modes.js"></script>
  <script src="offline-tools.js"></script>
  <script src="round-polish.js"></script>
  <script src="v3-core.js"></script>
  <script src="v3-academic.js"></script>
  <script src="v3-show.js"></script>\n  <script src="audio-dynamics.js"></script>
</body>
</html>
