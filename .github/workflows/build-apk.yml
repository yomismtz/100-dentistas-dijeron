name: Build Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar las 45 categorias
        run: |
          python3 scripts/validate_45_categories.py


      - name: Validar JavaScript del juego
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/characters.js
          node --check app/src/main/assets/narrator.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore upload keystore when configured
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-key.jks"
            echo "UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/upload-key.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release AAB
        env:
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          gradle --no-daemon bundleRelease

      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Inspect AAB signature
        run: |
          echo "AAB generado:"
          ls -lh app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab || true

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: 100-dentistas-dijeron-v1.2-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: 100-dentistas-dijeron-v1.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# Release build trigger: compile current main after completed app changes.
