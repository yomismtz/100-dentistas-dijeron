name: Build Android APK

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar banco de preguntas
        run: |
          python3 scripts/validate_questions.py
          python3 scripts/validate_ui_offline.py

      - name: Validar sintaxis JavaScript V2
        run: |
          node --check app/src/main/assets/v2.js
          node --check app/src/main/assets/v2-extras.js
          node --check app/src/main/assets/tvshow.js
          node --check app/src/main/assets/specialties.js
          node --check app/src/main/assets/careo.js
          node --check app/src/main/assets/narrator.js
          node --check app/src/main/assets/offline-tools.js
          node --check app/src/main/assets/offline-modes.js
          node --check app/src/main/assets/offline-remote.js
          node --check app/src/main/assets/round-polish.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 100-dentistas-dijeron-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
